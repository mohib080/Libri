<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libri - Online Bookshop</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>

  <header id="header">
    <div class="container">
      <h1 class="logo"><i class="fas fa-graduation-cap"></i> Libri</h1>

      <div class="search-bar">
        <input type="text" placeholder="Search for books...">
      </div>

      <div class="nav-area">
        <nav>
          <a href="#">Home</a>
          <a href="#">Categories</a>
          <a href="#">Contact</a>
        </nav>
        <button class="cart-btn"><i class="fas fa-shopping-cart"></i> Cart</button>
        <div class="profile-container">
        </div>
        <button id="dark-mode-toggle" class="dark-mode-btn">
          <i class="fas fa-moon"></i> </button>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h2>Your Gateway to Every Book Imaginable</h2>
      <p>Explore the best collection of books, eBooks, and more—all in one place.</p>
      <a href="#" class="btn-primary">Start Browsing</a>
    </div>
  </section>

  <section class="books-section">
    <div class="container">
      <h2>Featured Books</h2>
      <div class="book-grid">
      </div>
    </div>
  </section>

  <footer>
    <div class="container">
      <p>&copy; 2025 Libri. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>

</body>

</html>
