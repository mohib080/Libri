<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .tab.active {
            background-color: #ffffff;
            color: #4f46e5;
            border-bottom: 2px solid #4f46e5;
        }

        .tab {
            background-color: #e5e7eb;
            color: #6b7280;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-md bg-white rounded-lg shadow-xl overflow-hidden">
        <!-- Tabs for Login / Sign Up -->
        <div class="flex">
            <button id="loginTab"
                class="tab flex-1 py-3 font-semibold text-center transition-colors active">Login</button>
            <button id="signupTab" class="tab flex-1 py-3 font-semibold text-center transition-colors">Sign Up</button>
        </div>

        <div class="p-8">
            <!-- Login Form -->
            <form id="loginForm">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Seller Login</h2>
                <div class="space-y-6">
                    <div>
                        <label for="loginEmail" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="loginEmail"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required>
                    </div>
                    <div>
                        <label for="loginPassword" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="loginPassword"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required>
                    </div>
                    <div id="loginNotification" style="display: none;"></div>
                    <button type="submit"
                        class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-md hover:bg-indigo-700">Login</button>
                </div>
            </form>

            <!-- Sign Up Form (hidden by default) -->
            <form id="signupForm" style="display: none;">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">Create Seller Account</h2>
                <div class="space-y-6">
                    <div>
                        <label for="fullName" class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="fullName"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required>
                    </div>
                    <div>
                        <label for="signupEmail" class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="email" id="signupEmail"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required>
                    </div>
                    <div>
                        <label for="signupPassword" class="block text-sm font-medium text-gray-700">Password</label>
                        <input type="password" id="signupPassword"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required
                            minlength="6">
                    </div>
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm
                            Password</label>
                        <input type="password" id="confirmPassword"
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm" required>
                    </div>
                    <div id="signupNotification" style="display: none;"></div>
                    <button type="submit"
                        class="w-full bg-indigo-600 text-white font-bold py-2 px-4 rounded-md hover:bg-indigo-700">Create
                        Account & Login</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/seller-auth.js"></script>

</body>

</html>
