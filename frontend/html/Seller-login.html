<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Login & Signup</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        .auth-container {
            background-color: #ffffff; /* White background for the form */
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 450px;
            width: 100%;
        }
        .tab-button {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            color: #6b7280; /* Gray text */
            transition: color 0.2s, border-color 0.2s;
        }
        .tab-button.active {
            color: #4f46e5; /* Indigo text when active */
            border-color: #4f46e5; /* Indigo border when active */
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151; /* Darker gray for labels */
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db; /* Light gray border */
            border-radius: 8px;
            font-size: 16px;
            color: #1f2937; /* Dark text */
            background-color: #f9fafb; /* Very light gray input background */
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #4f46e5; /* Indigo on focus */
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); /* Light indigo shadow on focus */
        }
        .submit-button {
            width: 100%;
            padding: 14px;
            background-color: #4f46e5; /* Indigo button */
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.2s, transform 0.1s;
        }
        .submit-button:hover {
            background-color: #4338ca; /* Darker indigo on hover */
            transform: translateY(-1px);
        }
        .submit-button:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Seller Account</h1>

        <div class="flex mb-8 border-b border-gray-200">
            <button id="loginTab" class="tab-button active">Login</button>
            <button id="signupTab" class="tab-button">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" action="#" method="POST" class="space-y-6">
            <div class="form-group">
                <label for="login-email">Email Address</label>
                <input type="email" id="login-email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="login-password">Password</label>
                <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
            </div>

            <div>
                <button type="submit" class="submit-button">Login</button>
            </div>
        </form>

        <!-- Signup Form (hidden by default) -->
        <form id="signupForm" action="#" method="POST" class="space-y-6 hidden">
            <div class="form-group">
                <label for="signup-name">Full Name</label>
                <input type="text" id="signup-name" name="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="signup-email">Email Address</label>
                <input type="email" id="signup-email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="signup-password">Password</label>
                <input type="password" id="signup-password" name="password" placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="signup-confirm-password">Confirm Password</label>
                <input type="password" id="signup-confirm-password" name="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <div>
                <button type="submit" class="submit-button">Sign Up</button>
            </div>
        </form>
    </div>

    <script>
        const loginTab = document.getElementById('loginTab');
        const signupTab = document.getElementById('signupTab');
        const loginForm = document.getElementById('loginForm');
        const signupForm = document.getElementById('signupForm');

        // Function to show a specific form and activate its tab
        function showForm(formToShow, tabToActivate) {
            // Hide all forms
            loginForm.classList.add('hidden');
            signupForm.classList.add('hidden');

            // Deactivate all tabs
            loginTab.classList.remove('active');
            signupTab.classList.remove('active');

            // Show the selected form
            formToShow.classList.remove('hidden');

            // Activate the selected tab
            tabToActivate.classList.add('active');
        }

        // Event listeners for tab clicks
        loginTab.addEventListener('click', () => {
            showForm(loginForm, loginTab);
        });

        signupTab.addEventListener('click', () => {
            showForm(signupForm, signupTab);
        });

        // Optional: Add form submission handlers (for demonstration, they just log to console)
        loginForm.addEventListener('submit', (event) => {
            event.preventDefault(); // Prevent default form submission
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            console.log('Login Attempt:', { email, password });
            // Here you would typically send this data to a server
            // For a real application, you'd add validation and API calls here.
        });

        signupForm.addEventListener('submit', (event) => {
            event.preventDefault(); // Prevent default form submission
            const fullName = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const confirmPassword = document.getElementById('signup-confirm-password').value;

            if (password !== confirmPassword) {
                // In a real app, show a user-friendly error message on the page
                console.error('Passwords do not match!');
                alert('Passwords do not match!'); // Using alert for demonstration, replace with custom modal in production
                return;
            }
            console.log('Signup Attempt:', { fullName, email, password });
            // Here you would typically send this data to a server
            // For a real application, you'd add validation and API calls here.
        });
    </script>
</body>
</html>
