<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Libri - Online Bookshop</title>
    <link rel="stylesheet" href="../css/user.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <header id="header">
        <div class="container">
            <h1 class="logo"><i class="fas fa-graduation-cap"></i> Libri</h1>

            <div class="nav-area">
                <nav>
                    <a href="user.html">Home</a>
                    <a href="#" id="categories-nav-link">Categories</a>
                    <a href="#">Contact</a>
                </nav>
                <!-- Seller Button Added Here -->
                <a href="seller-login.html" class="seller-btn" title="Seller Login">
                    <i class="fas fa-store"></i> Seller
                </a>
                <a href="cart.html" class="cart-btn" id="cart-nav-btn" title="Cart"><i class="fas fa-shopping-cart"></i>
                    <span id="cart-item-count" class="cart-count">0</span></a>
                <a href="wishlist.html" class="wishlist-btn" id="wishlist-nav-btn" title="Wishlist"><i
                        class="fas fa-heart"></i> <span id="wishlist-item-count" class="wishlist-count">0</span></a>
                <button id="dark-mode-toggle" class="dark-mode-btn" title="Toggle Dark Mode">
                    <i class="fas fa-moon"></i>
                </button>
                <div class="profile-container">
                    <a href="#" class="profile-link" id="profile-nav-btn" title="Profile"><i
                            class="fas fa-user-circle"></i></a>
                    <div class="profile-dropdown">
                        <a href="profile.html">My Profile</a>
                        <a href="orders.html">My Orders</a>
                        <a href="logout.html" id="logout-link">Logout</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>Your Journey to Knowledge Starts Here</h2>
            <p>Discover millions of books, from bestsellers to hidden gems. Find your next great read with Libri.</p>
            <div class="hero-search">
                <input type="text" id="hero-search-box" placeholder="" autocomplete="off" />
                <button type="submit" style="display:none;">Search</button>
            </div>
        </div>
    </section>

    <section class="filter-section">
        <div class="container">
            <div class="filters-container">
                <div class="filter-group">
                    <label for="category-select">Category:</label>
                    <select id="category-select">
                        <option value="">All Categories</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="subcategory-select">Sub-Category:</label>
                    <select id="subcategory-select" disabled>
                        <option value="">All Sub-Categories</option>
                    </select>
                </div>
                <button id="clear-filters-btn" class="clear-filters-btn">Clear Filters</button>
            </div>
        </div>
    </section>

    <section class="books-section">
        <div class="container">
            <h2>Featured Books</h2>
            <div class="book-grid">
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Libri. All rights reserved.</p>
        </div>
    </footer>

    <div id="notification-area" class="notification-area"></div>


    <script src="../js/user.js"></script>

</body>

</html>
