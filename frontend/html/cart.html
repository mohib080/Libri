<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - BookWise</title>
    <link rel="stylesheet" href="/css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div id="notification-area" class="notification-area"></div>

        <div class="container main-content">
            <h1><i class="fas fa-shopping-cart"></i> Your Cart</h1>

            <div class="cart-items">
                <!-- Cart Header Row -->
                <div class="cart-header-row">
                    <span class="header-item-details">Product</span>
                    <span class="header-format">Format</span>
                    <span class="header-price">Price</span>
                    <span class="header-quantity">Quantity</span>
                    <span class="header-total">Total</span>
                    <span class="header-actions">Actions</span>
                </div>
                <!-- Empty Cart Message -->
                <div class="empty-cart-message" style="display: none;">
                    <i class="fas fa-shopping-basket"></i>
                    <p>Your cart is currently empty.</p>
                    <a href="user.html" class="btn-primary">Continue Shopping</a>
                </div>
            </div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span class="summary-label">Items in Cart:</span>
                    <span id="items-count">0</span>
                </div>
                <div class="summary-row total-row">
                    <span class="summary-label">Total Amount:</span>
                    <span class="total-amount">$<span id="total-price">0.00</span></span>
                </div>
                <button class="checkout-btn" id="checkout-btn">
                    <i class="fas fa-credit-card"></i>
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </main>

    <script src="/js/cart.js"></script>
</body>

</html>
