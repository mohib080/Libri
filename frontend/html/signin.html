<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Libri</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../css/signin.css" />

</head>

<body>
  <div class="auth-container">
    <div class="login-box">
      <div class="login-left">
        <h2>Login</h2>
        <form id="signin">
          <div class="form-group">
            <input type="text" id="signin-email" placeholder=" " required />
            <label for="signin-email">Username</label>
          </div>
          <div class="form-group">
            <input type="password" id="signin-password" placeholder=" " required />
            <label for="signin-password">Password</label>
          </div>
          <button type="submit">Login</button>
        </form>
        <div class="switch-form">
          Don’t have an account? <a href="signup.html">Sign Up</a>
        </div>
      </div>

      <div class="login-right">
        <i class="fas fa-graduation-cap cap-icon"></i>
        <h2>WELCOME BACK!</h2>
        <p>Log in to your account and continue your reading journey with us.</p>
      </div>
    </div>
  </div>
  <script src="../js/signin.js"></script>
</body>

</html>
