<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign In - Libri</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+Pro:wght@400;600&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="../css/signin.css" />
</head>

<body>
  <!-- Notification Area - NEW -->
  <div id="notification-area" class="notification-area"></div>

  <main class="signin-screen">
    <section class="signin-left">
      <h2>Welcome Back</h2>
      <form id="signin" autocomplete="off" novalidate>
        <div class="form-group">
          <input type="email" id="email" placeholder=" " required />
          <label for="email">Email or Username</label>
          <span class="error-msg" aria-live="polite"></span>
        </div>

        <div class="form-group">
          <input type="password" id="password" placeholder=" " required />
          <label for="password">Password</label>
          <span class="error-msg" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn-primary">Sign In</button>
      </form>
      <div class="switch-form">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </section>

    <aside class="signin-right">
      <i class="fas fa-book cap-icon"></i>
      <h2>Join the Libri World</h2>
      <p>Access your personal library and continue your journey with books.</p>
    </aside>
  </main>

  <script src="../js/signin.js"></script>
  <script src="../js/script.js"></script>
</body>

</html>
