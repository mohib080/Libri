<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information Entry</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background-color: #ffffff;
            /* White background for the form */
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            /* Darker gray for labels */
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            /* Light gray border */
            border-radius: 8px;
            font-size: 16px;
            color: #1f2937;
            /* Dark text */
            background-color: #f9fafb;
            /* Very light gray input background */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4f46e5;
            /* Indigo on focus */
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            /* Light indigo shadow on focus */
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            /* Allow vertical resizing */
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background-color: #4f46e5;
            /* Indigo button */
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .submit-button:hover {
            background-color: #4338ca;
            /* Darker indigo on hover */
            transform: translateY(-1px);
        }

        .submit-button:active {
            transform: translateY(0);
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Please insert the book info</h1>

        <form action="#" method="POST" class="space-y-6">
            <!-- Book Title -->
            <div class="form-group">
                <label for="book-title">Book Title</label>
                <input type="text" id="book-title" name="bookTitle" placeholder="Enter book title" required>
            </div>

            <!-- Format Dropdown -->
            <div class="form-group">
                <label for="format">Format</label>
                <select id="format" name="format" required>
                    <option value="">Select a format</option>
                    <option value="hardcover">Hardcover</option>
                    <option value="paperback">Paperback</option>
                    <option value="ebook">Ebook</option>
                </select>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Enter book description" rows="5"></textarea>
            </div>

            <!-- Price -->
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" step="0.01" min="0" placeholder="e.g., 29.99" required>
            </div>

            <!-- ISBN -->
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" placeholder="e.g., 978-3-16-148410-0" required>
            </div>

            <!-- Publisher -->
            <div class="form-group">
                <label for="publisher">Publisher</label>
                <input type="text" id="publisher" name="publisher" placeholder="Enter publisher name" required>
            </div>

            <!-- Publication Date -->
            <div class="form-group">
                <label for="publication-date">Publication Date</label>
                <input type="date" id="publication-date" name="publicationDate" required>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" class="submit-button">Submit Book Info</button>
            </div>
        </form>
    </div>
</body>

</html>
