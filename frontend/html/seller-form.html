<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Information Entry</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            /* Light gray background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .form-container {
            background-color: #ffffff;
            /* White background for the form */
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 100%;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #374151;
            /* Darker gray for labels */
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            /* Light gray border */
            border-radius: 8px;
            font-size: 16px;
            color: #1f2937;
            /* Dark text */
            background-color: #f9fafb;
            /* Very light gray input background */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4f46e5;
            /* Indigo on focus */
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            /* Light indigo shadow on focus */
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
            /* Allow vertical resizing */
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background-color: #4f46e5;
            /* Indigo button */
            color: #ffffff;
            font-weight: 600;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .submit-button:hover {
            background-color: #4338ca;
            /* Darker indigo on hover */
            transform: translateY(-1px);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        /* Custom modal for messages */
        .modal {
            display: none;
            /* Hidden by default */
            position: fixed;
            /* Stay in place */
            z-index: 1000;
            /* Sit on top */
            left: 0;
            top: 0;
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            overflow: auto;
            /* Enable scroll if needed */
            background-color: rgba(0, 0, 0, 0.4);
            /* Black w/ opacity */
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: #fefefe;
            margin: auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-button:hover,
        .close-button:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Please insert the book info</h1>

        <form id="bookInfoForm" action="#" method="POST" class="space-y-6">
            <!-- Book Title -->
            <div class="form-group">
                <label for="book-title">Book Title</label>
                <input type="text" id="book-title" name="bookTitle" placeholder="Enter book title" required>
            </div>

            <div class="form-group">
                <label for="author-name">Author Name</label>
                <input type="text" id="author-name" name="authorName" placeholder="e.g., J.K. Rowling" required>
            </div>

            <div class="form-group">
                <label for="quantity">Quantity in Stock</label>
                <input type="number" id="quantity" name="quantity" min="0" placeholder="e.g., 50" required>
            </div>

            <div class="form-group">
                <label for="format">Format</label>
                <select id="format" name="format" required>
                    <option value="">Select a format</option>
                    <option value="2">Hardcover</option>
                    <option value="1">Paperback</option>
                    <option value="3">Ebook</option>
                </select>
            </div>

            <!-- Description -->
            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" placeholder="Enter book description" rows="5"></textarea>
            </div>

            <!-- Price -->
            <div class="form-group">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" step="0.01" min="0" placeholder="e.g., 29.99" required>
            </div>

            <!-- ISBN -->
            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" placeholder="e.g., 978-3-16-148410-0" required>
            </div>

            <!-- Publisher -->
            <div class="form-group">
                <label for="publisher">Publisher</label>
                <input type="text" id="publisher" name="publisher" placeholder="Enter publisher name" required>
            </div>

            <!-- Publication Date -->
            <div class="form-group">
                <label for="publication-date">Publication Date</label>
                <input type="date" id="publication-date" name="publicationDate" required>
            </div>

            <!-- Payment Options Section -->
            <div class="form-group">
                <label for="payment-method">Preferred Payment Method for Sales</label>
                <select id="payment-method" name="paymentMethod">
                    <option value="">Select a method</option>
                    <option value="bank-account">Bank Account</option>
                    <option value="cod">Cash on Delivery (COD)</option>
                    <option value="credit-debit">Credit/Debit Card</option>
                </select>
            </div>

            <!-- Bank Account Details (hidden by default) -->
            <div id="bankAccountDetails" class="space-y-6 hidden">
                <div class="form-group">
                    <label for="bank-name">Bank Name</label>
                    <input type="text" id="bank-name" name="bankName" placeholder="e.g., Bank of America">
                </div>
                <div class="form-group">
                    <label for="account-number">Account Number</label>
                    <input type="text" id="account-number" name="accountNumber" placeholder="Enter account number">
                </div>
                <div class="form-group">
                    <label for="routing-number">Routing Number / SWIFT Code</label>
                    <input type="text" id="routing-number" name="routingNumber"
                        placeholder="Enter routing number or SWIFT code">
                </div>
            </div>

            <!-- COD Details (hidden by default) -->
            <div id="codDetails" class="space-y-6 hidden">
                <p class="text-gray-600 text-sm">No additional details required for Cash on Delivery.</p>
            </div>\

            <div id="notification" style="display:none;"></div>


            <!-- Credit/Debit Card Details (hidden by default) -->
            <div id="creditDebitDetails" class="space-y-6 hidden">
                <div class="form-group">
                    <label for="card-number">Card Number</label>
                    <input type="text" id="card-number" name="cardNumber" placeholder="Enter card number"
                        pattern="[0-9]{13,19}" title="Credit card numbers are 13 to 19 digits long" required>
                </div>
                <div class="form-group">
                    <label for="card-holder-name">Card Holder Name</label>
                    <input type="text" id="card-holder-name" name="cardHolderName"
                        placeholder="Enter card holder's name" required>
                </div>
                <div class="flex space-x-4">
                    <div class="form-group w-1/2">
                        <label for="expiry-date">Expiry Date (MM/YY)</label>
                        <input type="text" id="expiry-date" name="expiryDate" placeholder="MM/YY"
                            pattern="(0[1-9]|1[0-2])\/([0-9]{2})" title="Enter expiry date in MM/YY format" required>
                    </div>
                    <div class="form-group w-1/2">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" name="cvv" placeholder="CVV" pattern="[0-9]{3,4}"
                            title="Enter 3 or 4 digit CVV" required>
                    </div>
                </div>
            </div>

            <!-- Submit Button -->
            <div>
                <button type="submit" class="submit-button">Submit Book Info</button>
            </div>
        </form>
    </div>

    <!-- Custom Modal for Messages -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <p id="modalMessage"></p>
            <button onclick="document.getElementById('myModal').style.display='none'"
                class="mt-4 px-4 py-2 bg-indigo-500 text-white rounded-md">OK</button>
        </div>
    </div>

    <script src="../js/seller-form.js"></script>

</body>

</html>
