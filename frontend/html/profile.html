<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Your Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="nav-left">
            <a href="user.html" class="site-logo"><i class="fas fa-graduation-cap"></i> Libri</a>
        </div>
        <div class="nav-right">
            <button id="dark-mode-toggle" title="Toggle dark mode">
                <i class="fas fa-moon"></i>
            </button>
            <div class="profile-container"></div>
        </div>
    </nav>
    <main>
        <section class="profile-card">
            <div class="avatar-section">
                <img id="profile-avatar" src="https://www.gravatar.com/avatar/default?s=128&d=mp" alt="Profile avatar">
                <label for="avatar-upload" class="avatar-upload-label">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="avatar-upload" accept="image/*" hidden>
            </div>
            <div class="profile-info">
                <h2 id="profile-name">Your Name</h2>
                <p id="profile-email"><i class="fas fa-envelope"></i> your.email@example.com</p>
                <p id="profile-phone"><i class="fas fa-phone"></i> Phone: </p>
                <p id="profile-address"><i class="fas fa-map-marker-alt"></i> Address: </p>
                <p id="profile-role"><i class="fas fa-user-tag"></i> Role: </p>
                <p id="profile-verified"><i class="fas fa-check-circle"></i> Verified: </p>
                <p id="profile-last-login"><i class="fas fa-clock"></i> Last Login: </p>
                <div class="profile-actions">
                    <button id="edit-profile-btn"><i class="fas fa-edit"></i> Edit Profile</button>
                    <button id="change-password-btn"><i class="fas fa-key"></i> Change Password</button>
                </div>
            </div>
        </section>
        <section class="profile-details" id="edit-profile-section" style="display:none;">
            <h3>Edit Profile</h3>
            <form id="profile-edit-form">
                <label>
                    Name:
                    <input type="text" id="edit-name" name="name" required>
                </label>
                <label>
                    Email:
                    <input type="email" id="edit-email" name="email" required>
                </label>
                <label>
                    Phone:
                    <input type="text" id="edit-phone" name="phone_number">
                </label>
                <label>
                    Address:
                    <input type="text" id="edit-address" name="address">
                </label>
                <div class="form-actions">
                    <button type="submit">Save</button>
                    <button type="button" id="cancel-edit-btn">Cancel</button>
                </div>
            </form>
        </section>
        <section class="profile-details" id="change-password-section" style="display:none;">
            <h3>Change Password</h3>
            <form id="change-password-form">
                <label>
                    Old Password:
                    <input type="password" name="old-password" id="old-password" required>
                </label>
                <label>
                    New Password:
                    <input type="password" name="new-password" id="new-password" required>
                </label>
                <div class="form-actions">
                    <button type="submit">Change</button>
                    <button type="button" id="cancel-password-btn">Cancel</button>
                </div>
            </form>
        </section>
    </main>
    <script src="profile.js"></script>
</body>
</html>
