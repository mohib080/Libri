<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Libri</title>
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="profile-layout">
        <!-- Sidebar Navigation -->
        <aside class="profile-sidebar">
            <div class="sidebar-header">
                <i class="fas fa-user-circle"></i>
                <h2>My Account</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#profile-details" class="nav-link active"><i class="fas fa-user-edit"></i> Profile Details</a>
                <a href="#security" class="nav-link"><i class="fas fa-shield-alt"></i> Security</a>
                <a href="orders.html" class="nav-link"><i class="fas fa-box"></i> My Orders</a>
                <a href="user.html" class="nav-link"><i class="fas fa-store"></i> Back to Shop</a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="logout-link" class="nav-link logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="profile-content">
            <header class="content-header">
                <h1 id="welcome-message">Hello, User!</h1>
                <p>Manage your account information and password here.</p>
            </header>

            <!-- Notification Area -->
            <div id="notification" class="notification hidden"></div>

            <!-- Profile Details Section -->
            <section id="profile-details" class="content-section">
                <div class="card">
                    <div class="card-header">
                        <h3>Personal Information</h3>
                    </div>
                    <div class="card-body">
                        <form id="profile-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="fullName">Full Name</label>
                                    <input type="text" id="fullName" required>
                                </div>
                                <div class="form-group">
                                    <label for="email">Email</label>
                                    <input type="email" id="email" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="phone">Phone Number</label>
                                <input type="tel" id="phone">
                            </div>
                            <div class="form-group">
                                <label for="address">Address</label>
                                <textarea id="address" rows="3"></textarea>
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Security Section -->
            <section id="security" class="content-section hidden">
                <div class="card">
                    <div class="card-header">
                        <h3>Password & Security</h3>
                    </div>
                    <div class="card-body">
                        <form id="password-form">
                            <div class="form-group">
                                <label for="current-password">Current Password</label>
                                <input type="password" id="current-password" required>
                            </div>
                            <div class="form-group">
                                <label for="new-password">New Password</label>
                                <input type="password" id="new-password" required minlength="6">
                            </div>
                            <div class="form-group">
                                <label for="confirm-password">Confirm New Password</label>
                                <input type="password" id="confirm-password" required minlength="6">
                            </div>
                            <div class="form-actions">
                                <button type="submit" class="btn btn-primary">Update Password</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../js/profile.js"></script>
</body>

</html>
