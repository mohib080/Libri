<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Details - Libri</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Specific styles for book-details page - Enhanced Styling */
        body {
            font-family: 'Inter', sans-serif;
            background: #f9f9fb;
            color: #333;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
            /* Smooth dark mode transition */
        }

        .book-detail-section {
            padding: 4rem 0;
            background: #f9f9fb;
            transition: background 0.3s ease;
        }

        .book-detail-container {
            display: flex;
            flex-wrap: wrap;
            gap: 3rem;
            align-items: flex-start;
            max-width: 1100px;
            /* Slightly wider container */
            margin: auto;
            background: #fff;
            border-radius: 15px;
            /* More rounded corners */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            /* Stronger, softer shadow */
            padding: 3rem;
            /* More padding */
            animation: fadeIn 0.5s ease-out;
            /* Fade in animation */
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .book-cover-wrapper {
            flex: 1;
            min-width: 300px;
            /* Increased min-width */
            text-align: center;
            position: relative;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            /* Shadow for the image wrapper */
            border-radius: 10px;
            overflow: hidden;
            /* Ensure rounded corners apply to image */
        }

        .book-cover-wrapper img {
            max-width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            max-height: 500px;
            /* Adjusted height */
            transition: transform 0.3s ease;
        }

        .book-cover-wrapper img:hover {
            transform: scale(1.03);
            /* Subtle zoom on hover */
        }

        .book-info {
            flex: 2;
            min-width: 400px;
            /* Increased min-width */
            display: flex;
            flex-direction: column;
        }

        .book-info h2 {
            font-size: 3rem;
            /* Larger title */
            margin-bottom: 0.8rem;
            color: #222;
            line-height: 1.2;
            font-weight: 700;
        }

        .book-info .author {
            font-size: 1.4rem;
            color: #555;
            margin-bottom: 0.5rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .book-info .author i {
            color: #4A90E2;
        }

        .overall-rating {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-size: 1.5rem;
            color: #FFD700;
            /* Gold for stars */
            margin-bottom: 1.5rem;
            /* Space below rating */
            font-weight: 600;
        }

        .overall-rating .average-score {
            font-size: 1.7rem;
            color: #333;
            font-weight: 700;
        }

        .overall-rating .stars .fas,
        .overall-rating .stars .far {
            font-size: 1.4rem;
            /* Size of stars */
            margin-right: 2px;
        }

        /* Styling for the review count text */
        .overall-rating .review-count-text {
            font-size: 1rem;
            /* Smaller font size for the count text */
            color: #777;
            /* Softer color */
            margin-left: -0.3rem;
            /* Adjust spacing */
            font-weight: 400;
            /* Lighter weight */
        }

        .book-info .price {
            font-size: 2.2rem;
            /* Larger price */
            color: #4A90E2;
            font-weight: 800;
            margin-bottom: 1.5rem;
        }

        .book-info .description {
            font-size: 1.1rem;
            /* Slightly larger description */
            line-height: 1.8;
            color: #444;
            margin-bottom: 2rem;
            flex-grow: 1;
            /* Allow description to take available space */
        }

        .book-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            /* Two columns for meta info */
            gap: 1rem;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
        }

        .book-meta-item {
            display: flex;
            flex-direction: column;
        }

        .book-meta-item strong {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 0.2rem;
        }

        .book-meta-item span {
            font-size: 1rem;
            color: #333;
            font-weight: 500;
        }

        .action-buttons {
            display: flex;
            gap: 1.2rem;
            /* More space between buttons */
            margin-top: 1.5rem;
        }

        .action-buttons button {
            background: linear-gradient(45deg, #4A90E2, #6a5acd);
            /* Gradient button */
            color: white;
            border: none;
            padding: 1rem 2.2rem;
            /* More padding */
            border-radius: 30px;
            /* More rounded */
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            /* Larger font */
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .action-buttons button:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #367cd6, #5340ba);
            /* Darker gradient on hover */
        }

        .action-buttons button:active {
            transform: translateY(-2px);
        }

        .action-buttons button i {
            margin-right: 0.5rem;
        }

        .back-to-home {
            display: block;
            margin-top: 3.5rem;
            /* More margin */
            text-align: center;
            font-size: 1.2rem;
            /* Larger font */
            color: #4A90E2;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .back-to-home:hover {
            color: #367cd6;
            transform: translateX(-5px);
            /* Slide effect on hover */
        }

        /* Reviews Section Styles - SUPER STYLISH */
        .reviews-section {
            background: linear-gradient(135deg, #f0f4f8, #e6e9ed);
            /* Subtle gradient background */
            padding: 4rem 0;
            /* More padding for spacious feel */
            margin-top: 4rem;
            /* More margin from above section */
            border-top: 1px solid #dcdfe4;
            /* Softer border */
            animation: fadeIn 0.8s ease-out;
            /* Slightly longer fade in */
        }

        .reviews-section h2 {
            text-align: center;
            font-size: 2.8rem;
            /* Larger heading */
            margin-bottom: 3.5rem;
            /* More space below heading */
            color: #1a202c;
            /* Darker, more prominent heading color */
            position: relative;
            padding-bottom: 1rem;
            /* Space for underline effect */
        }

        .reviews-section h2::after {
            content: '';
            position: absolute;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 80px;
            /* Stylish underline */
            height: 4px;
            background: #4A90E2;
            border-radius: 2px;
        }

        .review-list {
            max-width: 950px;
            /* Slightly wider list */
            margin: auto;
            display: grid;
            /* Use grid for potentially better layout control */
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            /* Two columns on larger screens */
            gap: 2rem;
            /* More gap between review cards */
        }

        .review-card {
            background: #ffffff;
            border-radius: 12px;
            /* More rounded */
            padding: 2rem;
            /* More padding */
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            /* Stronger, softer shadow */
            transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
            position: relative;
            overflow: hidden;
            /* For pseudo-elements */
            border: 1px solid #e0e0e0;
            /* Subtle border */
        }

        .review-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(to right, #4A90E2, #6a5acd);
            /* Gradient top border */
            border-radius: 12px 12px 0 0;
        }

        .review-card:hover {
            transform: translateY(-8px) scale(1.02);
            /* More pronounced lift and slight scale */
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
            /* Even stronger shadow on hover */
            background: #f8f8f8;
            /* Slight background change on hover */
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            /* More space */
            padding-bottom: 0.8rem;
            border-bottom: 1px solid #f0f0f0;
            /* Separator */
        }

        .reviewer-name {
            font-weight: 700;
            color: #333;
            font-size: 1.2rem;
            /* Slightly larger name */
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .reviewer-name::before {
            content: "\f007";
            /* User icon */
            font-family: "Font Awesome 6 Pro";
            /* Ensure Font Awesome is loaded */
            font-weight: 900;
            /* For solid icon */
            color: #4A90E2;
            font-size: 1.1rem;
        }

        .review-rating {
            color: #FFD700;
            /* Gold color for stars */
            font-size: 1.3rem;
            /* Larger stars in individual review */
        }

        .review-rating .fas,
        .review-rating .far {
            margin-right: 1px;
            /* Tighter spacing for stars */
        }


        .review-comment {
            font-size: 1.05rem;
            /* Slightly larger comment text */
            line-height: 1.7;
            color: #444;
            margin-bottom: 1rem;
        }

        .review-date {
            font-size: 0.8rem;
            /* Slightly smaller date */
            color: #999;
            /* Lighter color for date */
            text-align: right;
            /* Align date to the right */
            font-style: italic;
            /* Italicize date */
        }


        /* Dark Mode Specific Styles for book-details - Enhanced */
        body.dark-mode .book-detail-section {
            background: #121212;
            color: #e0e0e0;
        }

        body.dark-mode .book-detail-container {
            background: #212121;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.08);
        }

        body.dark-mode .book-info h2 {
            color: #e0e0e0;
        }

        body.dark-mode .book-info .author {
            color: #bbbbbb;
        }

        body.dark-mode .book-info .author i {
            color: #bb86fc;
        }

        body.dark-mode .overall-rating .average-score {
            color: #e0e0e0;
        }

        body.dark-mode .overall-rating .stars {
            color: #FFD700;
            /* Gold still for dark mode stars */
        }

        body.dark-mode .overall-rating .review-count-text {
            color: #9e9e9e;
            /* Dark mode color for count text */
        }


        body.dark-mode .book-info .price {
            color: #bb86fc;
        }

        body.dark-mode .book-info .description {
            color: #bbbbbb;
        }

        body.dark-mode .book-meta {
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
        }

        body.dark-mode .book-meta-item strong {
            color: #9e9e9e;
        }

        body.dark-mode .book-meta-item span {
            color: #e0e0e0;
        }

        body.dark-mode .action-buttons button {
            background: linear-gradient(45deg, #bb86fc, #a020f0);
            /* Dark mode gradient */
            color: #212121;
            box-shadow: 0 4px 15px rgba(187, 134, 252, 0.2);
        }

        body.dark-mode .action-buttons button:hover {
            background: linear-gradient(45deg, #9c6ade, #7e16c9);
            /* Darker dark mode gradient on hover */
            box-shadow: 0 8px 20px rgba(187, 134, 252, 0.3);
        }

        body.dark-mode .back-to-home {
            color: #bb86fc;
        }

        body.dark-mode .back-to-home:hover {
            color: #9c6ade;
        }

        /* Dark Mode Reviews Section Styles - SUPER STYLISH */
        body.dark-mode .reviews-section {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            /* Darker subtle gradient */
            border-top-color: #333;
        }

        body.dark-mode .reviews-section h2 {
            color: #e0e0e0;
        }

        body.dark-mode .reviews-section h2::after {
            background: #bb86fc;
            /* Dark mode underline color */
        }

        body.dark-mode .review-card {
            background: #303030;
            box-shadow: 0 8px 25px rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            /* Darker subtle border */
        }

        body.dark-mode .review-card::before {
            background: linear-gradient(to right, #bb86fc, #a020f0);
            /* Dark mode gradient top border */
        }

        body.dark-mode .review-card:hover {
            box-shadow: 0 12px 35px rgba(255, 255, 255, 0.1);
            background: #3a3a3a;
            /* Slight background change on hover */
        }

        body.dark-mode .reviewer-name {
            color: #e0e0e0;
        }

        body.dark-mode .reviewer-name::before {
            color: #bb86fc;
            /* Dark mode icon color */
        }

        body.dark-mode .review-rating {
            color: #FFD700;
            /* Still gold in dark mode */
        }

        body.dark-mode .review-date {
            color: #9e9e9e;
        }

        body.dark-mode .review-comment {
            color: #bbbbbb;
        }


        /* Responsive adjustments */
        @media (max-width: 768px) {
            .book-detail-container {
                flex-direction: column;
                padding: 1.5rem;
                text-align: center;
                gap: 2rem;
            }

            .book-cover-wrapper {
                min-width: unset;
                width: 80%;
                /* Adjust width for smaller screens */
                margin: 0 auto;
                /* Center image */
            }

            .book-info {
                min-width: unset;
                width: 100%;
                text-align: center;
                /* Center text info on mobile */
            }

            .book-info .author {
                justify-content: center;
                /* Center author icon and text */
            }

            .book-info h2 {
                font-size: 2.2rem;
            }

            .book-info .author {
                font-size: 1.2rem;
            }

            .book-info .price {
                font-size: 1.8rem;
            }

            .book-meta {
                grid-template-columns: 1fr;
                /* Stack meta info vertically */
                gap: 0.8rem;
                padding: 1rem;
            }

            .action-buttons {
                flex-direction: column;
                gap: 0.8rem;
            }

            .action-buttons button {
                width: 100%;
                /* Full width buttons */
            }

            .reviews-section h2 {
                font-size: 1.8rem;
            }

            .review-list {
                grid-template-columns: 1fr;
                /* Single column on small screens */
            }
        }
    </style>
</head>

<body>
    <header id="header">
        <div class="container">
            <h1 class="logo"><i class="fas fa-graduation-cap"></i> Libri</h1>

            <div class="nav-area">
                <nav>
                    <a href="index.html">Home</a>
                    <a href="#">Categories</a>
                    <a href="#">Contact</a>
                </nav>
                <button class="cart-btn"><i class="fas fa-shopping-cart"></i> Cart</button>
                <div class="profile-container">
                    <a href="signin.html" class="profile-link">Login</a>
                    <a href="signup.html" class="profile-link">Sign Up</a>
                </div>

                <button id="dark-mode-toggle" class="dark-mode-btn">
                    <i class="fas fa-moon"></i> </button>
            </div>
        </div>
    </header>

    <section class="book-detail-section">
        <div class="container">
            <div class="book-detail-container" id="book-details-content">
                <!-- Book details will be loaded here by JavaScript -->
                <p>Loading book details...</p>
            </div>
            <a href="index.html" class="back-to-home">
                <i class="fas fa-arrow-left"></i> Back to Home
            </a>
        </div>
    </section>

    <!-- New Reviews Section -->
    <section class="reviews-section">
        <div class="container">
            <h2>Customer Reviews</h2>
            <div class="review-list" id="review-list-content">
                <!-- Reviews will be loaded here by JavaScript -->
                <p style="text-align: center; color: #555;">No reviews yet. Be the first to review!</p>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 Libri. All rights reserved.</p>
        </div>
    </footer>

    <!-- Include the new JavaScript file for this page -->
    <script src="../js/book-details.js"></script>
    <script src="../js/script.js"></script> <!-- Keep global script for dark mode etc. -->

</body>

</html>
